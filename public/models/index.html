<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Монгол нутаг — Three.js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000000; overflow: hidden; font-family: serif; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #f5e6c8; font-size: 22px; letter-spacing: 6px; text-align: center;
    text-shadow: 0 2px 12px rgba(200,120,30,0.8);
    pointer-events: none; z-index: 10;
    font-family: 'Georgia', serif;
  }
  #ui small { display: block; font-size: 11px; letter-spacing: 3px; color: #c8a06a; margin-top: 4px; }
  #hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #c8a06a88; font-size: 11px; letter-spacing: 2px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="ui">МОНГОЛ НУТАГ <small>MONGOLIAN STEPPES · THREE.JS</small></div>
<div id="hint">DRAG TO ROTATE · SCROLL TO ZOOM · RIGHT-DRAG TO PAN</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

// ─── SCENE SETUP ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0xc8d8e8, 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 28, 55);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ─── LIGHTING ─────────────────────────────────────────────────
const sun = new THREE.DirectionalLight(0xfff0cc, 2.2);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 300;
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.0003;
scene.add(sun);

scene.add(new THREE.AmbientLight(0x9bb8d4, 0.6));
const fillLight = new THREE.DirectionalLight(0xaad4f5, 0.4);
fillLight.position.set(-30, 20, -10);
scene.add(fillLight);
const warmFill = new THREE.DirectionalLight(0xf5d0a0, 0.3);
warmFill.position.set(10, 5, 40);
scene.add(warmFill);

// ─── ORBIT CONTROLS (manual) ──────────────────────────────────
let isDragging = false, isRightDrag = false;
let prevMouse = { x: 0, y: 0 };
let theta = 0.2, phi = 0.38, radius = 65;
let targetTheta = theta, targetPhi = phi, targetRadius = radius;
let panX = 0, panZ = 0, targetPanX = 0, targetPanZ = 0;

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; isRightDrag = e.button === 2;
  prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  if (isRightDrag) {
    targetPanX -= dx * 0.05; targetPanZ -= dy * 0.05;
  } else {
    targetTheta -= dx * 0.005; targetPhi = Math.max(0.12, Math.min(1.2, targetPhi - dy * 0.005));
  }
  prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('wheel', e => {
  targetRadius = Math.max(15, Math.min(120, targetRadius + e.deltaY * 0.08));
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── HELPERS ──────────────────────────────────────────────────
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b+1));

function makeMat(color, rough=0.85, metal=0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}

// ─── TERRAIN ──────────────────────────────────────────────────
const terrainW = 160, terrainD = 130, segs = 180;
const tGeo = new THREE.PlaneGeometry(terrainW, terrainD, segs, segs);
tGeo.rotateX(-Math.PI/2);
const pos = tGeo.attributes.position;

// Height function
function terrainHeight(x, z) {
  let h = 0;
  h += Math.sin(x*0.05)*Math.cos(z*0.06)*3.5;
  h += Math.sin(x*0.13)*Math.cos(z*0.11)*1.8;
  h += Math.sin(x*0.3+1)*Math.cos(z*0.28+2)*0.8;
  // Mountains in back
  const mDist = Math.sqrt(Math.pow(x*0.7,2) + Math.pow(z+45,2));
  h += Math.max(0, 18 - mDist*0.6);
  // Right rocky hills
  const rDist = Math.sqrt(Math.pow(x-55,2) + Math.pow(z+15,2));
  h += Math.max(0, 12 - rDist*0.5);
  // Gobi-like flat south
  if (z > 30) h *= 0.3;
  return h;
}

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  pos.setY(i, terrainHeight(x, z));
}
tGeo.computeVertexNormals();

// Vertex colors by height
const colors = new Float32Array(pos.count * 3);
for (let i = 0; i < pos.count; i++) {
  const h = pos.getY(i);
  const x = pos.getX(i), z = pos.getZ(i);
  let r, g, b;
  // River area
  const riverDist = Math.abs(x + 28) + Math.abs(z - z*0.1);
  const nearRiver = (x > -42 && x < -18 && z > -55 && z < 30);
  if (nearRiver && Math.abs(x+30 + Math.sin(z*0.12)*6) < 5) {
    r=0.35; g=0.55; b=0.75; // water blue-green
  } else if (h > 12) {
    const t = Math.min((h-12)/8, 1);
    r=0.72+t*0.2; g=0.68+t*0.2; b=0.60+t*0.2; // snow/rock
  } else if (h > 6) {
    r=0.65; g=0.58; b=0.42; // rocky
  } else if (h > 1) {
    r=0.72+rand(-0.05,0.05); g=0.68+rand(-0.05,0.05); b=0.38+rand(-0.04,0.04); // golden steppe
  } else {
    r=0.68; g=0.65; b=0.42; // dry flat
  }
  // Near trees — add green tint
  colors[i*3]=r; colors[i*3+1]=g; colors[i*3+2]=b;
}
tGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const terrain = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.92, metalness: 0
}));
terrain.receiveShadow = true;
scene.add(terrain);

// ─── GET TERRAIN Y ────────────────────────────────────────────
function getY(x, z) { return terrainHeight(x, z); }

// ─── RIVER ────────────────────────────────────────────────────
function makeRiver() {
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const t = i/60;
    const z = -55 + t*85;
    const x = -30 + Math.sin(z*0.12)*8 + Math.sin(z*0.07+1)*4;
    pts.push(new THREE.Vector3(x, getY(x,z)+0.15, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const rGeo = new THREE.TubeGeometry(curve, 100, 1.8, 10, false);
  const rMat = new THREE.MeshStandardMaterial({
    color: 0x4a8ab5, roughness: 0.1, metalness: 0.3,
    transparent: true, opacity: 0.85
  });
  const river = new THREE.Mesh(rGeo, rMat);
  river.receiveShadow = true;
  scene.add(river);

  // Bridge
  const bx = -30 + Math.sin(-5*0.12)*8;
  const bz = -5;
  const bGeo = new THREE.BoxGeometry(6, 0.4, 2.5);
  const bridge = new THREE.Mesh(bGeo, makeMat(0x8b6914, 0.8));
  bridge.position.set(bx, getY(bx,bz)+0.5, bz);
  bridge.castShadow = true;
  scene.add(bridge);
}
makeRiver();

// ─── TREES ────────────────────────────────────────────────────
function makeTree(x, z, scale=1) {
  const g = new THREE.Group();
  const ty = getY(x,z);
  // Trunk
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12*scale, 0.18*scale, 1.2*scale, 6),
    makeMat(0x5c3d1e, 0.95)
  );
  trunk.position.y = 0.6*scale;
  g.add(trunk);
  // Foliage layers
  const colors2 = [0x2d6a2d, 0x1e5c1e, 0x3a7a3a, 0x266426];
  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry((1.1-i*0.25)*scale, (1.4-i*0.2)*scale, 7),
      makeMat(colors2[i%colors2.length], 0.9)
    );
    cone.position.y = (1.2 + i*0.9)*scale;
    cone.rotation.y = rand(0, Math.PI);
    g.add(cone);
  }
  g.position.set(x, ty, z);
  g.castShadow = true;
  g.receiveShadow = true;
  scene.add(g);
}

// Tree clusters along river
const treeClusters = [
  [-35,-40], [-28,-30], [-38,-20], [-25,-10], [-32,5], [-40,15],
  [-20,-45], [-15,-35], [-22,-22], [-30,20], [-18,10],
  [-42,-50], [-36,-8], [-26,25], [-20,30],
  [5,-45],[8,-38],[12,-30],[6,-18],
  [-5,-50],[-8,-42],[-3,-28],
  [15,-40],[18,-30],[22,-22]
];
treeClusters.forEach(([x,z]) => {
  const n = randInt(3,7);
  for (let i=0;i<n;i++) makeTree(x+rand(-3,3), z+rand(-3,3), rand(0.6,1.1));
});

// ─── GER (Mongolian Yurt) ──────────────────────────────────────
function makeGer(x, z, rotY=0, scale=1) {
  const g = new THREE.Group();
  const ty = getY(x,z);

  // Base platform (stone ring)
  const baseMat = makeMat(0xa09070, 0.95);
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(2.5*scale, 2.6*scale, 0.25*scale, 20),
    baseMat
  );
  base.position.y = 0.12;
  g.add(base);

  // Walls
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0xf0e8d8, roughness: 0.7,
    map: (() => {
      const c = document.createElement('canvas'); c.width=128; c.height=64;
      const ctx = c.getContext('2d');
      ctx.fillStyle='#f0e8d8';ctx.fillRect(0,0,128,64);
      ctx.strokeStyle='#c8b898'; ctx.lineWidth=1;
      for(let i=0;i<20;i++){ctx.beginPath();ctx.moveTo(i*7,0);ctx.lineTo(i*7,64);ctx.stroke();}
      const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
      t.repeat.set(4,1); return t;
    })()
  });
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(2.4*scale, 2.4*scale, 1.8*scale, 20, 1, true),
    wallMat
  );
  wall.position.y = 0.9*scale + 0.25;
  g.add(wall);

  // Roof — orange/terracotta
  const roofMat = makeMat(0xc8824a, 0.8);
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(2.5*scale, 1.3*scale, 20),
    roofMat
  );
  roof.position.y = (1.8 + 0.65)*scale + 0.25;
  g.add(roof);

  // Roof ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.35*scale, 0.1*scale, 8, 20),
    makeMat(0xe8a040, 0.5, 0.3)
  );
  ring.position.y = (1.8+1.3)*scale + 0.25;
  ring.rotation.x = Math.PI/2;
  g.add(ring);

  // Door
  const doorMat = makeMat(0x7a4a1a, 0.8);
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(0.7*scale, 1.4*scale, 0.08*scale),
    doorMat
  );
  door.position.set(0, 0.7*scale + 0.25, 2.42*scale);
  g.add(door);

  // Door frame
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(0.85*scale, 1.5*scale, 0.05*scale),
    makeMat(0xe8a040, 0.7, 0.1)
  );
  frame.position.set(0, 0.75*scale + 0.25, 2.45*scale);
  g.add(frame);

  // Decorative felt patterns on wall
  const patMat = makeMat(0xe05030, 0.8);
  for(let i=0;i<3;i++){
    const pat=new THREE.Mesh(
      new THREE.BoxGeometry(0.5*scale,0.1*scale,0.05*scale),
      patMat
    );
    const angle = (i/3)*Math.PI*2 + 1;
    pat.position.set(Math.sin(angle)*2.42*scale, 1.5*scale+0.25, Math.cos(angle)*2.42*scale);
    pat.rotation.y = -angle;
    g.add(pat);
  }

  // Guy ropes
  for(let i=0;i<6;i++){
    const angle=i/6*Math.PI*2;
    const rp=new THREE.Mesh(
      new THREE.CylinderGeometry(0.02,0.02,2.2,4),
      makeMat(0xd4c090,0.9)
    );
    rp.position.set(Math.sin(angle)*1.8*scale, 1.8*scale+0.25, Math.cos(angle)*1.8*scale);
    rp.rotation.z = Math.sin(angle)*0.5;
    rp.rotation.x = -Math.cos(angle)*0.5;
    g.add(rp);
  }

  g.position.set(x, ty, z);
  g.rotation.y = rotY;
  g.castShadow = true;
  g.receiveShadow = true;
  scene.add(g);
  return g;
}

// ─── HORSE ────────────────────────────────────────────────────
function makeHorse(x, z, rotY=0, color=0x6b3a1f) {
  const g = new THREE.Group();
  const ty = getY(x,z);
  const mat = makeMat(color, 0.8);
  const dkMat = makeMat(0x2a1508, 0.85);

  // Body
  const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.45,0.38), mat);
  bodyBox.position.y = 0.85;
  bodyBox.rotation.z = 0.05;
  g.add(bodyBox);

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,0.5,8), mat);
  neck.position.set(0.38,1.1,0); neck.rotation.z=-0.5;
  g.add(neck);

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.22,0.22), mat);
  head.position.set(0.62,1.32,0);
  g.add(head);
  // Snout
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.16,0.18), mat);
  snout.position.set(0.82,1.26,0);
  g.add(snout);
  // Eye
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.03,6,6), makeMat(0x111111,0.3));
  eye.position.set(0.73,1.35,0.1);
  g.add(eye);

  // Legs
  const legPositions = [[0.28,0,-0.14],[0.28,0,0.14],[-0.28,0,-0.14],[-0.28,0,0.14]];
  legPositions.forEach(([lx,ly,lz],i) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.055,0.75,8), mat);
    leg.position.set(lx, 0.42, lz);
    const kick = (i===1)?0.15:0;
    leg.rotation.x = kick;
    g.add(leg);
    // Hoof
    const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,0.14), dkMat);
    hoof.position.set(lx, 0.05+Math.sin(kick)*0.1, lz+Math.sin(kick)*0.2);
    g.add(hoof);
  });

  // Tail
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.6,8), dkMat);
  tail.position.set(-0.52,0.9,0); tail.rotation.z=1.3;
  g.add(tail);

  // Mane
  const mane = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.25,0.18), dkMat);
  mane.position.set(0.4,1.2,0); mane.rotation.z=-0.3;
  g.add(mane);

  g.position.set(x, ty, z);
  g.rotation.y = rotY;
  g.scale.setScalar(rand(0.85,1.1));
  g.castShadow=true; g.receiveShadow=true;
  scene.add(g);
  return g;
}

// ─── RIDER ────────────────────────────────────────────────────
function makeRider(x, z, rotY=0) {
  const g = new THREE.Group();
  const ty = getY(x,z);
  const coat = makeMat([0x8b2020,0x1a4a8a,0x2a6a2a,0x6a4a1a][randInt(0,3)], 0.85);
  const skin = makeMat(0xc8946a, 0.9);

  // Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.38,0.22), coat);
  torso.position.y = 1.5;
  g.add(torso);
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8), skin);
  head.position.y = 1.84;
  g.add(head);
  // Hat
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.18,0.12,10), makeMat(0x2a2a2a,0.9));
  hat.position.y = 1.96;
  g.add(hat);
  // Arms
  [-0.2,0.2].forEach(side => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.3,6), coat);
    arm.position.set(side*0.9, 1.54, 0.1); arm.rotation.z=side*0.8; arm.rotation.x=0.4;
    g.add(arm);
  });
  // Legs
  [-0.1,0.1].forEach(side => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.065,0.065,0.3,6), coat);
    leg.position.set(side, 1.2, 0.1); leg.rotation.x=0.5;
    g.add(leg);
  });

  g.position.set(x, ty, z);
  g.rotation.y = rotY;
  g.castShadow=true; g.receiveShadow=true;
  scene.add(g);
  return g;
}

// ─── CAMEL ────────────────────────────────────────────────────
function makeCamel(x, z, rotY=0) {
  const g = new THREE.Group();
  const ty = getY(x,z);
  const mat = makeMat(0xc8a060, 0.9);
  const dkMat = makeMat(0x8a6030, 0.9);

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.3,0.58,0.52), mat);
  body.position.y = 1.1;
  g.add(body);
  // Humps (two-humped Bactrian!)
  [-0.25,0.25].forEach(ox => {
    const hump = new THREE.Mesh(new THREE.SphereGeometry(0.22,10,8), mat);
    hump.position.set(ox,1.46,0); hump.scale.set(0.8,1,0.7);
    g.add(hump);
  });
  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.16,0.7,8), mat);
  neck.position.set(0.65,1.4,0); neck.rotation.z=-0.4;
  g.add(neck);
  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.26,0.26), mat);
  head.position.set(1.0,1.65,0);
  g.add(head);
  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.18,0.22), mat);
  snout.position.set(1.23,1.58,0);
  g.add(snout);
  // Lips (darker)
  const lip = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.06,0.22), dkMat);
  lip.position.set(1.34,1.54,0);
  g.add(lip);
  // Eye
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04,6,6), makeMat(0x111111,0.2));
  eye.position.set(1.08,1.68,0.12);
  g.add(eye);
  // Legs (long!)
  [[0.4,0,-0.2],[0.4,0,0.2],[-0.4,0,-0.2],[-0.4,0,0.2]].forEach(([lx,ly,lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.065,1.0,8), mat);
    leg.position.set(lx,0.55,lz);
    g.add(leg);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6), dkMat);
    foot.position.set(lx,0.06,lz); foot.scale.set(1.2,0.5,1.4);
    g.add(foot);
  });
  // Tail
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.04,0.4,6), dkMat);
  tail.position.set(-0.72,1.1,0); tail.rotation.z=1.6;
  g.add(tail);

  g.position.set(x, ty, z);
  g.rotation.y = rotY;
  g.scale.setScalar(rand(0.85,1.05));
  g.castShadow=true; g.receiveShadow=true;
  scene.add(g);
  return g;
}

// ─── EAGLE ────────────────────────────────────────────────────
function makeEagle(x, y, z) {
  const g = new THREE.Group();
  const mat = makeMat(0x3a2010, 0.8);
  const lightMat = makeMat(0xd4a060, 0.8);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8), mat);
  body.scale.set(1.5,0.7,0.8);
  g.add(body);
  // Wings
  [-1,1].forEach(side => {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.05,1.4,0.45), mat);
    wing.position.set(0,0,side*1.0); wing.rotation.x=side*0.15;
    g.add(wing);
    // Wing tip
    const tip = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.5,0.25), mat);
    tip.position.set(0,0,side*1.75); tip.rotation.x=side*0.3;
    g.add(tip);
  });
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8), lightMat);
  head.position.set(0.42,0.1,0);
  g.add(head);
  // Beak
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.2,6), makeMat(0xf0c030,0.6));
  beak.position.set(0.6,0.05,0); beak.rotation.z=-Math.PI/2;
  g.add(beak);
  // Tail
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.5,0.3), mat);
  tail.position.set(-0.5,0,0); tail.rotation.z=0.3;
  g.add(tail);

  g.position.set(x,y,z);
  g.rotation.y = rand(0,Math.PI*2);
  scene.add(g);
  return g;
}

// ─── ROCKS ────────────────────────────────────────────────────
function makeRock(x, z, scale=1) {
  const g = new THREE.Group();
  const ty = getY(x,z);
  const n = randInt(1,4);
  for(let i=0;i<n;i++){
    const geo = new THREE.DodecahedronGeometry(rand(0.3,0.8)*scale, 0);
    const mesh = new THREE.Mesh(geo, makeMat(0x8a8078+randInt(-10,10)*256, 0.95));
    mesh.position.set(rand(-0.4,0.4)*scale,rand(0.2,0.4)*scale,rand(-0.4,0.4)*scale);
    mesh.rotation.set(rand(0,Math.PI),rand(0,Math.PI),rand(0,Math.PI));
    mesh.castShadow=true; mesh.receiveShadow=true;
    g.add(mesh);
  }
  g.position.set(x,ty,z);
  scene.add(g);
}

// ─── STONE MONUMENT ───────────────────────────────────────────
function makeOvoo(x, z) {
  const g = new THREE.Group();
  const ty = getY(x,z);

  for(let i=0;i<8;i++){
    const r=new THREE.Mesh(
      new THREE.DodecahedronGeometry(rand(0.3,0.7),0),

    );

    r.rotation.set(rand(0,Math.PI),rand(0,Math.PI),rand(0,Math.PI));
    r.castShadow=true;
    g.add(r);
  }
  // Flag pole
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,3,8), makeMat(0x5c3d1e,0.9));
  pole.position.y=2;

  [[0xc82020,0],[0x2020c8,0.4],[0xf0c020,0.8]].forEach(([col,oy],i)=>{

    flag.position.set(0.4,3.5-i*0.5,0);

  scene.add(g);
}

// ─── FENCE ────────────────────────────────────────────────────
function makeFence(cx, cz, w, d, rotY=0) {
  const g = new THREE.Group();
  const mat = makeMat(0xa0824a, 0.95);

  // Simple box fence outline
  const fencePts = [[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2],[-w/2,-d/2]];
  for(let s=0;s<4;s++){
    const [ax,az]=fencePts[s], [bx,bz]=fencePts[s+1];
    const len=Math.sqrt((bx-ax)**2+(bz-az)**2);
    const mx=(ax+bx)/2, mz=(az+bz)/2;
    const rail=new THREE.Mesh(new THREE.BoxGeometry(len,0.08,0.06),mat);
    rail.position.set(mx,0.75,mz);
    rail.rotation.y=Math.atan2(bx-ax,bz-az);
    g.add(rail);
    const rail2=new THREE.Mesh(new THREE.BoxGeometry(len,0.08,0.06),mat);
    rail2.position.set(mx,0.45,mz);
    rail2.rotation.y=Math.atan2(bx-ax,bz-az);
    g.add(rail2);
    // Posts
    const n=Math.max(2,Math.floor(len/2.5));
    for(let i=0;i<=n;i++){
      const t=i/n;
      const px=ax+(bx-ax)*t, pz=az+(bz-az)*t;
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,1.0,6),mat);
      post.position.set(px,0.5,pz);
      post.castShadow=true;
      g.add(post);
    }
  }
  g.position.set(cx, getY(cx,cz), cz);
  g.rotation.y=rotY;
  scene.add(g);
}

function makeMountain(x, z, h, r) {
  const geo = new THREE.ConeGeometry(r, h, randInt(5,8));

// ─── SKYBOX / CLOUDS ──────────────────────────────────────────
function makeCloud(x,y,z,scale=1){
  const g=new THREE.Group();
  [[0,0,0,1.2],[0.8,0.3,0,0.9],[-0.7,0.2,0,0.85],[0.4,-0.2,0.5,0.75],[-0.3,-0.1,-0.5,0.7]].forEach(([cx,cy,cz,r])=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(r*scale,8,6),new THREE.MeshStandardMaterial({color:0xf8f8ff,roughness:1,transparent:true,opacity:0.88}));
    m.position.set(cx*scale,cy*scale,cz*scale);
    g.add(m);
  });
  g.position.set(x,y,z);
  scene.add(g);
  return g;
}
const clouds=[];

// ─── ANIMATION ────────────────────────────────────────────────
const clock = new THREE.Clock();
let eagleRef = scene.children.filter(c=>c.children&&c.children.length>0).slice(-2); // crude

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Smooth camera
  theta += (targetTheta-theta)*0.06;
  phi += (targetPhi-phi)*0.06;
  radius += (targetRadius-radius)*0.06;
  panX += (targetPanX-panX)*0.06;
  panZ += (targetPanZ-panZ)*0.06;

  camera.position.set(
    Math.sin(theta)*Math.cos(phi)*radius + panX,
    Math.sin(phi)*radius,
    Math.cos(theta)*Math.cos(phi)*radius + panZ
  );
  camera.lookAt(panX, 0, panZ);

  // Clouds drift
  clouds.forEach((c,i)=>{
    c.position.x += 0.008*(i%2===0?1:-0.6);
    if(c.position.x > 90) c.position.x=-90;
    if(c.position.x < -90) c.position.x=90;
  });

  // Sun movement (subtle)
  sun.position.x = 40*Math.cos(t*0.05);
  sun.position.z = 20*Math.sin(t*0.05);

  renderer.render(scene, camera);
}
animate();
